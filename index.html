<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romantic Matrix - For Marwah</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=JetBrains+Mono:wght@100;200;300&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050203; /* Gelap romantis */
            overflow: hidden;
            font-family: 'Cormorant Garamond', serif;
        }

        /* Canvas Background */
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Overlay Welcome Screen */
        #welcome-screen {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #050203;
            transition: opacity 1s ease-out;
        }

        #welcome-btn {
            padding: 1rem 3rem;
            background: rgba(225, 29, 72, 0.05);
            border: 1px solid rgba(225, 29, 72, 0.5);
            color: #fbcfe8;
            border-radius: 9999px;
            font-size: 1.1rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 0 20px rgba(225, 29, 72, 0.2);
            backdrop-filter: blur(8px);
        }

        #welcome-btn:hover {
            background: rgba(225, 29, 72, 0.2);
            border-color: rgba(225, 29, 72, 0.8);
            color: #ffffff;
            box-shadow: 0 0 30px rgba(225, 29, 72, 0.6);
            transform: scale(1.02);
        }

        /* Countdown Overlay */
        #countdown-screen {
            position: absolute;
            inset: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #countdown-text {
            font-size: 5rem;
            color: #ffffff;
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.9);
            animation: pulse 1s infinite;
            text-align: center;
        }

        @media (min-width: 768px) {
            #countdown-text { font-size: 8rem; }
        }

        /* Final Heart Screen Content */
        #heart-screen {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 2.5s ease-in-out;
        }

        .glow-rose {
            color: #ffffff;
            text-shadow: 0 0 10px rgba(255, 200, 215, 0.6), 0 0 25px rgba(244, 114, 182, 0.5), 0 0 45px rgba(225, 29, 72, 0.3), 0 4px 15px rgba(0, 0, 0, 0.85);
        }

        #sub-text {
            opacity: 0; /* Awalnya hidden untuk animasi fadeInUp */
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(0.9); opacity: 0.7; }
        }

        /* Animasi muncul dari bawah */
        .fade-in-up {
            animation: fadeInUp 2s ease-out forwards;
            animation-delay: 1.5s; /* Delay setelah siluet hati terbentuk */
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(30px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes pageEntry {
            0% {
                opacity: 0;
                transform: scale(0.95);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        .page-entry-anim {
            animation: pageEntry 1.5s ease-out forwards;
        }
    </style>
</head>
<body>
    <!-- Canvas Matrix Hujan Partikel -->
    <canvas id="matrix"></canvas>

    <!-- Matrix Gradient Overlay (Sleek Theme) -->
    <div class="absolute inset-0 pointer-events-none" style="z-index: 2; background: radial-gradient(circle at center, transparent 0%, rgba(5,2,3,0.6) 60%, #050203 100%);"></div>

    <!-- Overlay Sambutan Awal -->
    <div id="welcome-screen" class="page-entry-anim flex flex-col items-center justify-center space-y-6 md:space-y-8 z-50 p-4">
        <p class="text-rose-200 text-lg md:text-2xl italic font-serif text-center tracking-wide font-light drop-shadow-[0_2px_5px_rgba(0,0,0,0.8)]">
            " Buka amplop ini ya maraa ada sesuatu buat kamu "
        </p>
        <button id="welcome-btn">Tekan ini yaa</button>
    </div>

    <!-- Teks Countdown -->
    <div id="countdown-screen">
        <div id="countdown-text">3</div>
    </div>

    <!-- Teks Romantis Final -->
    <div id="heart-screen" class="w-full h-full">
        
        <!-- Decorative Top Elements -->
        <div class="absolute top-0 left-0 w-full p-8 flex justify-between items-start z-20 pointer-events-none hidden md:flex">
            <div class="flex flex-col">
                <div class="text-xs tracking-widest text-rose-400 opacity-60 uppercase font-sans">Encryption Mode</div>
                <div class="text-xl font-light text-white italic">Rose Quartz Heart</div>
            </div>
            <div class="flex flex-col items-end">
                <div class="text-xs tracking-widest text-rose-400 opacity-60 uppercase font-sans">Time Signal</div>
                <div class="text-xl font-light text-white">∞ : ∞ : ∞</div>
            </div>
        </div>

        <div class="relative flex items-center justify-center w-full h-full">
            <!-- Dark void & glow behind text to make the heart center look 'empty' and boost contrast -->
            <div class="absolute w-[280px] md:w-[450px] h-[280px] md:h-[450px] bg-[#050203]/90 blur-[40px] rounded-full -mt-8"></div>
            <div class="absolute w-[260px] md:w-[420px] h-[260px] md:h-[420px] bg-rose-900/30 blur-[50px] rounded-full -mt-8"></div>
            
            <div class="absolute flex flex-col items-center text-center max-w-[90%] sm:max-w-[550px] px-4 -mt-16 z-10">
                <h1 id="main-text" class="text-3xl sm:text-4xl md:text-5xl font-semibold tracking-widest glow-rose mb-3 sm:mb-4 leading-relaxed opacity-100">
                    I miss you and<br />will always love you 🤍
                </h1>
                <div class="h-px w-24 sm:w-32 bg-gradient-to-r from-transparent via-rose-500 to-transparent my-4 sm:my-5 opacity-90"></div>
                <p id="sub-text" class="text-rose-100/90 text-sm sm:text-base md:text-lg italic font-light leading-relaxed tracking-wider px-2" style="text-shadow: 0 2px 5px rgba(0,0,0,1);">
                    "somehow, i always end up missing you,<br class="hidden sm:block"/> and you always be my favorite person"
                </p>
            </div>
        </div>

        <!-- Decorative Bottom Elements -->
        <div class="page-entry-anim absolute bottom-4 md:bottom-8 flex flex-col items-center w-full z-20" style="animation-delay: 0.5s; opacity: 0;">
            <div id="typing-text" class="text-[8px] md:text-[9px] text-center uppercase tracking-[0.2em] font-sans text-rose-300 mb-3 opacity-80 leading-[1.6] whitespace-pre-wrap min-h-[90px] w-[90%] max-w-[400px]"></div>
            <div class="w-48 md:w-64 h-[1px] bg-rose-900/50"></div>
        </div>
        
        <!-- Bottom gradient fade -->
        <div class="absolute inset-0 bg-gradient-to-t from-[#050203] via-transparent to-transparent h-48 bottom-0 mt-auto pointer-events-none"></div>
    </div>

    <!-- Audio Autoplay Workaround (Gunakan placeholder musik romantis, bisa diganti local mp3) -->
    <audio id="bgm" src="https://mp3tourl.com/audio/1783169784234-2bdc627e-4833-48b9-a250-37b7ed9a37a0.mp3" loop></audio>

    <script>
        // Inisialisasi Canvas
        const canvas = document.getElementById('matrix');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // Resize handler agar responsif
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            initParticles(); // Re-init agar rata saat rotasi layar
        });

        // Konfigurasi Karakter
        const RAIN_CHARS = ['0', '1', '0', '1', '0', '1', '0', '1', 'L', 'O', 'V', 'E', 'M', 'I', 'S', 'S', 'LOVE', 'MISS'];
        const HEART_CHARS = ['M', 'A', 'R', 'W', 'A', 'H', '🤍', '0', '1', '0', '1'];
        
        // Warna Matrix Rain (Tetap Merah)
        const RAIN_COLORS = [
            '#ff0033', // Bright Red
            '#e11d48', // Rose Red
            '#be123c', // Darker Red
            '#9f1239'  // Deep Red
        ];

        // Warna Siluet Hati (Beda, lebih kontras/terang)
        const HEART_COLORS = [
            '#fbcfe8', // Pink Pastel
            '#ffffff', // Putih
            '#f472b6', // Light pink
            '#fda4af'  // Rose
        ];
        
        let phase = 'idle'; // State: idle -> rain -> heart

        // Class Partikel Matrix
        class Particle {
            constructor(col, isHeart = false, heartIndex = 0, totalHearts = 1) {
                this.col = col;
                this.x = col * 25;
                this.y = Math.random() * height * 2 - height;
                this.role = isHeart ? 'heart' : 'rain';
                
                if (this.role === 'heart') {
                    this.char = HEART_CHARS[heartIndex % HEART_CHARS.length];
                    this.hideInHeart = false;
                    // Font diseragamkan dan diperbesar agar rapi membentuk outline
                    this.fontSize = 24; 
                    // Sudut didistribusikan merata agar partikel berurutan dan tidak bertubrukan
                    this.angle = (heartIndex / totalHearts) * Math.PI * 2;
                    this.rotationSpeed = 0.003; 
                } else {
                    this.char = RAIN_CHARS[Math.floor(Math.random() * RAIN_CHARS.length)];
                    this.hideInHeart = Math.random() > 0.15; 
                    this.fontSize = Math.random() * 8 + 12;
                    this.angle = 0;
                    this.rotationSpeed = 0;
                }
                
                this.rainColor = RAIN_COLORS[Math.floor(Math.random() * RAIN_COLORS.length)];
                this.heartColor = HEART_COLORS[Math.floor(Math.random() * HEART_COLORS.length)];
                
                this.speed = Math.random() * 4 + 2;
            }

            update(time, dtMultiplier) {
                if (phase === 'rain' || phase === 'idle' || (phase === 'heart' && this.role === 'rain')) {
                    // Logika Hujan Matrix (Turun ke bawah)
                    this.y += this.speed * dtMultiplier;
                    // Reset ke atas setelah melebihi layar
                    if (this.y > height + 20) {
                        this.y = -20;
                        this.x = this.col * 25;
                    }
                    // Animasi pergantian karakter secara random (hanya untuk partikel hujan)
                    if (Math.random() < 0.03 && this.role === 'rain') {
                        this.char = RAIN_CHARS[Math.floor(Math.random() * RAIN_CHARS.length)];
                    }
                } else if (phase === 'heart' && this.role === 'heart') {
                    // Kecepatan putar seragam agar posisi relatif tidak berubah (tidak saling bertubrukan)
                    this.angle += this.rotationSpeed * dtMultiplier;
                    if (this.angle > Math.PI * 2) this.angle -= Math.PI * 2;

                    const t = this.angle;
                    
                    // Efek berdenyut dinamis (Heartbeat) mengikuti waktu, diperlambat agar lebih stabil
                    const beat = 1 + Math.sin(time * 0.002) * 0.04;
                    
                    // Skala hati adaptif sesuai ukuran layar (diperbesar agar teks muat di tengah)
                    const scale = Math.min(width, height) * 0.035 * beat;

                    // Persamaan parametrik bentuk hati
                    const hX = 16 * Math.pow(Math.sin(t), 3);
                    const hY = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));

                    // Offset pusat layar (sedikit naik)
                    const centerX = width / 2;
                    const centerY = height / 2 - 30;

                    // Hilangkan noise acak agar partikel berurutan tepat di garis outline (tidak tebal/berantakan)
                    const targetX = centerX + (hX * scale);
                    const targetY = centerY + (hY * scale);

                    // Interpolasi posisi partikel perlahan menuju bentuk hati (Efek terbang mulus dengan framerate independent lerp)
                    const smoothFactor = 1 - Math.pow(1 - 0.15, dtMultiplier);
                    this.x += (targetX - this.x) * smoothFactor;
                    this.y += (targetY - this.y) * smoothFactor;
                    
                    // Tidak mengganti karakter secara sporadis agar tetap ejaan MARWAH🤍 berurutan
                }
            }

            draw(ctx) {
                // Sembunyikan sebagian besar partikel hujan saat fase heart agar tidak ramai
                if (phase === 'heart' && this.role === 'rain' && this.hideInHeart) return;

                let currentColor = (phase === 'heart' && this.role === 'heart') ? this.heartColor : this.rainColor;

                let fontWeight = (phase === 'heart' && this.role === 'heart') ? 600 : 300;
                ctx.font = `${fontWeight} ${this.fontSize}px 'JetBrains Mono', monospace`;
                ctx.fillStyle = currentColor;
                ctx.shadowColor = currentColor;
                
                // Efek Pendaran/Glow Light Romantis
                ctx.shadowBlur = phase === 'heart' ? 20 : 5;
                ctx.fillText(this.char, this.x, this.y);
                ctx.shadowBlur = 0; // Reset shadow untuk partikel lain
            }
        }

        // Generate Partikel (Kerapatan Tinggi)
        let particles = [];
        function initParticles() {
            particles = [];
            const cols = Math.floor(width / 25);
            const totalParticles = cols * 28;
            
            // 11 Karakter (M,A,R,W,A,H,🤍,0,1,0,1) dikali 5 putaran = 55 partikel heart
            const TOTAL_HEARTS = 55; 
            let heartCount = 0;
            
            for (let i = 0; i < cols; i++) {
                // Density: 28 partikel per kolom
                for(let j = 0; j < 28; j++) {
                    let isHeart = false;
                    const remainingParticles = totalParticles - particles.length;
                    const remainingHearts = TOTAL_HEARTS - heartCount;
                    
                    if (remainingHearts > 0 && Math.random() < (remainingHearts / remainingParticles)) {
                        isHeart = true;
                        particles.push(new Particle(i, isHeart, heartCount, TOTAL_HEARTS));
                        heartCount++;
                    } else {
                        particles.push(new Particle(i, false, 0, 1));
                    }
                }
            }
        }
        initParticles();

        // Game Loop / Animasi Utama
        let lastTime = performance.now();
        function render(time) {
            const deltaTime = time - lastTime;
            lastTime = time;
            
            // Batasi dt untuk menghindari lompatan animasi saat tab tidak aktif (dt multiplier berdasar 60fps)
            const dtMultiplier = Math.min(deltaTime / 16.66, 3);

            // Fill warna transparan menciptakan efek jejak memudar (trails)
            ctx.fillStyle = 'rgba(5, 2, 3, 0.15)';
            ctx.fillRect(0, 0, width, height);

            // Selalu jalankan animasi (baik 'idle', 'rain', atau 'heart')
            particles.forEach(p => {
                p.update(time, dtMultiplier);
                p.draw(ctx);
            });

            requestAnimationFrame(render);
        }
        requestAnimationFrame(time => {
            lastTime = time;
            render(time);
        });

        // --- Logika Interaksi UI ---
        const welcomeScreen = document.getElementById('welcome-screen');
        const welcomeBtn = document.getElementById('welcome-btn');
        const countdownScreen = document.getElementById('countdown-screen');
        const countdownText = document.getElementById('countdown-text');
        const heartScreen = document.getElementById('heart-screen');
        const subText = document.getElementById('sub-text');
        const bgm = document.getElementById('bgm');

        welcomeBtn.addEventListener('click', () => {
            // "Warm-up" audio untuk bypass strict autoplay restriction dari browser
            // Kita play lalu segera pause agar statusnya sudah diizinkan oleh user gesture
            bgm.volume = 0;
            bgm.play().then(() => {
                bgm.pause();
                bgm.currentTime = 0;
            }).catch(err => console.log('Autoplay ditolak:', err));

            // Disable button to prevent multiple clicks
            welcomeBtn.disabled = true;
            welcomeBtn.style.pointerEvents = 'none';

            // Fade out overlay sambutan
            welcomeScreen.style.opacity = '0';
            setTimeout(() => {
                welcomeScreen.style.display = 'none';
                startSequence();
            }, 1000); // Sinkron dgn durasi transisi CSS
        }, { once: true });

        function startSequence() {
            // Fase 1: Hujan Matrix turun dengan padat
            phase = 'rain';
            
            // Fase 2: Munculkan Countdown dan Kata-kata
            countdownScreen.style.opacity = '1';
            
            const sequence = ['3', '2', '1', 'You', 'Are', 'My', 'Love'];
            let index = 0;
            countdownText.innerText = sequence[index];

            const countInterval = setInterval(() => {
                index++;
                if (index < sequence.length) {
                    // Putar lagu tepat saat teks "My" muncul
                    if (sequence[index] === 'My') {
                        bgm.volume = 0.6;
                        bgm.play().catch(err => console.log('Autoplay ditolak:', err));
                    }

                    // Update kata/angka
                    countdownText.style.animation = 'none'; // reset animasi pulse
                    countdownText.offsetHeight; /* trigger reflow */
                    countdownText.style.animation = 'pulse 1s infinite';
                    countdownText.innerText = sequence[index];
                } else {
                    // Selesai sequence
                    clearInterval(countInterval);
                    countdownScreen.style.opacity = '0';
                    
                    // Fase 3: Transisi Hati dan Teks Romantis (Langsung tanpa delay)
                    phase = 'heart'; // mengubah target partikel segera menyatu
                    heartScreen.style.opacity = '1';
                    // Trigger animasi teks bawah
                    subText.classList.add('fade-in-up');
                    startTypingAnimation();
                }
            }, 1000); // 1 kata per detik
        }
        
        // Typing Animation untuk teks bawah
        function startTypingAnimation() {
            const typingTextElement = document.getElementById('typing-text');
            typingTextElement.textContent = ''; // Kosongkan sebelum mulai ngetik
            const textToType = "Think I'll miss you forever\nlike the stars miss the sun\nin the morning sky\n\nLater's better than never\neven if you're gone";
            let typingIndex = 0;
            
            function typeText() {
                if (typingIndex < textToType.length) {
                    typingTextElement.textContent += textToType.charAt(typingIndex);
                    typingIndex++;
                    // Variasikan kecepatan ngetik sedikit agar lebih natural
                    const delay = Math.random() * 30 + 50; 
                    setTimeout(typeText, delay);
                }
            }
            typeText();
        }
    </script>
</body>
</html>
